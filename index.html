<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Classic Tic-Tac-Toe</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app" aria-labelledby="game-title">
    <header class="header">
      <h1 id="game-title">Tic-Tac-Toe</h1>
      <p class="subtitle">Classic mode with persistent scores</p>
    </header>

    <section class="game-card" aria-label="Game board and controls">
      <p id="status" class="status" role="status" aria-live="polite">X's turn</p>

      <div id="board" class="board" role="grid" aria-label="Tic-tac-toe board">
        <button class="cell" type="button" data-index="0" aria-label="Cell 1"></button>
        <button class="cell" type="button" data-index="1" aria-label="Cell 2"></button>
        <button class="cell" type="button" data-index="2" aria-label="Cell 3"></button>
        <button class="cell" type="button" data-index="3" aria-label="Cell 4"></button>
        <button class="cell" type="button" data-index="4" aria-label="Cell 5"></button>
        <button class="cell" type="button" data-index="5" aria-label="Cell 6"></button>
        <button class="cell" type="button" data-index="6" aria-label="Cell 7"></button>
        <button class="cell" type="button" data-index="7" aria-label="Cell 8"></button>
        <button class="cell" type="button" data-index="8" aria-label="Cell 9"></button>
      </div>

      <div class="controls">
        <button id="new-round" type="button" class="control-btn">New Round</button>
        <button id="reset-scores" type="button" class="control-btn control-btn-secondary">Reset Scores</button>
      </div>
    </section>

    <section class="score-card" aria-label="Scoreboard">
      <h2>Scoreboard</h2>
      <div class="scores">
        <p>X: <span id="score-x">0</span></p>
        <p>O: <span id="score-o">0</span></p>
        <p>Draws: <span id="score-draws">0</span></p>
      </div>
    </section>
  </main>

  <script src="game-logic.js"></script>
  <script src="ui.js"></script>
</body>
</html>
